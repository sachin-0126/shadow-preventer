services:
  # Option 1: Python Flask Backend Web Service
  - type: web
    name: shadow-preventer
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.8
