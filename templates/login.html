<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Gate | SHADOW PREVENTER</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }
    .login-container {
      width: 100%;
      max-width: 480px;
      animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .login-card {
      background: rgba(20, 23, 34, 0.95);
      border: 1px solid var(--border-maroon);
      border-radius: var(--radius-lg);
      padding: 34px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(139, 30, 63, 0.35);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #8B1E3F, #ef4444, #8B1E3F);
    }
    .login-brand {
      text-align: center;
      margin-bottom: 26px;
    }
    .login-icon {
      width: 58px;
      height: 58px;
      background: var(--maroon-primary);
      border: 2px solid var(--maroon-light);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 26px;
      box-shadow: 0 0 20px var(--maroon-glow);
      margin-bottom: 14px;
    }
    .login-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .login-subtitle {
      color: #94a3b8;
      font-size: 12.5px;
      margin-top: 5px;
    }
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
      background: rgba(8, 9, 13, 0.6);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
    }
    .role-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 12.5px;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .role-tab-btn.active {
      background: var(--maroon-primary);
      color: #ffffff;
      box-shadow: 0 0 12px var(--maroon-glow);
    }
    .demo-accounts-box {
      margin-top: 26px;
      padding: 16px;
      background: rgba(8, 9, 13, 0.7);
      border: 1px dashed var(--border-maroon);
      border-radius: var(--radius-md);
      font-size: 11.5px;
    }
    .demo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #f43f5e;
      font-weight: 700;
      margin-bottom: 10px;
      font-family: var(--font-mono);
      text-transform: uppercase;
    }
    .demo-buttons-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .demo-btn {
      background: rgba(20, 23, 34, 0.8);
      border: 1px solid var(--border-subtle);
      color: #cbd5e1;
      padding: 7px 10px;
      border-radius: var(--radius-sm);
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      font-size: 11.5px;
    }
    .demo-btn:hover {
      border-color: var(--maroon-light);
      background: rgba(139, 30, 63, 0.25);
      color: #fff;
    }
    .demo-btn-danger:hover {
      border-color: var(--red-alert);
      background: rgba(239, 68, 68, 0.2);
    }
    .demo-cred {
      font-family: var(--font-mono);
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="cyber-bg-pattern"></div>

  <div class="login-wrapper">
    <div class="login-container">
      <div class="login-card">
        <div class="login-brand">
          <div class="login-icon">
            <i class="fas fa-shield-cat"></i>
          </div>
          <h1 class="login-title">SHADOW PREVENTER</h1>
          <p class="login-subtitle">Credential Threat Defense & Shadow Account Prevention</p>
          <div style="margin-top: 8px;">
            <span style="background: rgba(139,30,63,0.3); border: 1px solid var(--border-maroon); color: #f43f5e; font-size: 10.5px; font-family: var(--font-mono); padding: 3px 10px; border-radius: 12px; font-weight: 600;">
              SAVEETHA ENGINEERING COLLEGE &bull; CRIMATHON 2026
            </span>
          </div>
        </div>

        <!-- Role Selector Tab -->
        <div class="role-tabs">
          <button type="button" class="role-tab-btn active" id="tabAdmin" onclick="selectRole('admin')">
            <i class="fas fa-user-shield"></i>
            <span>SOC Admin</span>
          </button>
          <button type="button" class="role-tab-btn" id="tabEmployee" onclick="selectRole('employee')">
            <i class="fas fa-id-card"></i>
            <span>Employee</span>
          </button>
        </div>

        {% if error %}
        <div class="cyber-alert cyber-alert-danger" style="margin-bottom: 20px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-triangle-exclamation"></i>
            <span>{{ error }}</span>
          </div>
        </div>
        {% endif %}

        <form action="{{ url_for('login_page') }}" method="POST" id="loginForm">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

          <div class="form-group-cyber">
            <label class="form-label-cyber" for="username">
              <i class="fas fa-user-astronaut" style="margin-right: 5px; color: #f43f5e;"></i> Username
            </label>
            <input type="text" id="username" name="username" class="form-input-cyber" placeholder="e.g. admin or r.menon" value="{{ username_val or '' }}" required autofocus autocomplete="username">
          </div>

          <div class="form-group-cyber" style="margin-bottom: 24px;">
            <label class="form-label-cyber" for="password">
              <i class="fas fa-lock" style="margin-right: 5px; color: #f43f5e;"></i> Password
            </label>
            <input type="password" id="password" name="password" class="form-input-cyber" placeholder="Enter security passphrase" required autocomplete="current-password">
          </div>

          <button type="submit" class="btn-cyber btn-maroon" style="width: 100%; justify-content: center; padding: 12px; font-size: 14px; letter-spacing: 0.5px;">
            <i class="fas fa-right-to-bracket"></i>
            <span id="loginBtnText">Authenticate to SOC Console</span>
          </button>
        </form>

        <!-- Quick Demo Credentials Selector for Judges & Evaluators -->
        <div class="demo-accounts-box">
          <div class="demo-header">
            <span><i class="fas fa-key"></i> Quick Demo Logins</span>
            <span style="font-size: 10px; color: #94a3b8;">1-Click Fill</span>
          </div>
          <div class="demo-buttons-group">
            <button type="button" class="demo-btn" onclick="fillDemo('admin', 'Admin@2026', 'admin')">
              <span><i class="fas fa-user-shield" style="color: #ab254e; margin-right: 6px;"></i> <strong>SOC Administrator</strong></span>
              <span class="demo-cred">admin / Admin@2026</span>
            </button>
            <button type="button" class="demo-btn demo-btn-danger" onclick="fillDemo('r.menon', 'Rohan@1234', 'employee')">
              <span><i class="fas fa-skull-crossbones" style="color: #ef4444; margin-right: 6px;"></i> <strong>Rohan Menon (Demo Breach)</strong></span>
              <span class="demo-cred">r.menon / Rohan@1234</span>
            </button>
            <button type="button" class="demo-btn" onclick="fillDemo('a.sharma', 'Employee@2026', 'employee')">
              <span><i class="fas fa-user" style="color: #3b82f6; margin-right: 6px;"></i> <strong>Ananya Sharma (DevOps)</strong></span>
              <span class="demo-cred">a.sharma / Employee@2026</span>
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    function selectRole(role) {
      const tabAdmin = document.getElementById('tabAdmin');
      const tabEmp = document.getElementById('tabEmployee');
      const btnText = document.getElementById('loginBtnText');

      if (role === 'admin') {
        tabAdmin.classList.add('active');
        tabEmp.classList.remove('active');
        btnText.textContent = 'Authenticate to SOC Console';
      } else {
        tabEmp.classList.add('active');
        tabAdmin.classList.remove('active');
        btnText.textContent = 'Access Employee Portal';
      }
    }

    function fillDemo(username, password, role) {
      document.getElementById('username').value = username;
      document.getElementById('password').value = password;
      selectRole(role);
    }
  </script>
</body>
</html>
